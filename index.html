<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Design Scheduler</title>
<style>
/* WCAG AA compliant colour palette on dark backgrounds:
   --text #f0f0f8 on --bg #0f0f11 = 17.4:1 ✓
   --accent #7aaaff on dark = 5.2:1 ✓
   --muted #a0a0b8 on dark = 5.8:1 ✓
   --success #6bde9a = 5.1:1 ✓
   --warn #f5e070 = 9.4:1 ✓
   --danger #ff7a85 = 5.3:1 ✓
   Block text #111 on light job colours = passes at all sizes ✓ */
:root {
  --bg: #0f0f11;
  --surface: #1c1c22;
  --surface2: #26262f;
  --border: #38384a;
  --text: #f0f0f8;
  --muted: #a0a0b8;
  --accent: #7aaaff;
  --success: #6bde9a;
  --warn: #f5e070;
  --danger: #ff7a85;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 16px; min-height: 100vh; }

/* ── TOP NAV ── */
.topnav {
background: var(–surface);
border-bottom: 2px solid var(–border);
display: flex; align-items: center; justify-content: space-between;
padding: 0 16px; height: 56px; position: sticky; top: 0; z-index: 100;
}
.logo { font-family: Consolas, ‘Courier New’, monospace; font-size: 15px; letter-spacing: 0.06em; color: var(–accent); font-weight: 700; }
.logo span { color: var(–muted); font-weight: 400; }
.add-btn {
background: var(–accent); color: #0f0f11; border: none;
padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
}

/* ── TABS ── */
.tabs {
display: flex; background: var(–surface); border-bottom: 2px solid var(–border);
position: sticky; top: 56px; z-index: 99;
}
.tab {
flex: 1; text-align: center; padding: 14px 4px; font-size: 14px; font-weight: 600;
color: var(–muted); cursor: pointer; border-bottom: 3px solid transparent;
transition: all 0.15s;
}
.tab.active { color: var(–accent); border-bottom-color: var(–accent); }

/* ── CAP STRIP ── */
.cap-strip {
background: var(–surface); border-bottom: 1px solid var(–border);
padding: 10px 16px; display: flex; align-items: center; gap: 10px;
}
.cap-label { font-size: 13px; color: var(–muted); white-space: nowrap; font-weight: 600; }
.cap-track { flex: 1; height: 6px; background: var(–surface2); border-radius: 3px; overflow: hidden; }
.cap-fill { height: 100%; border-radius: 3px; }
.cap-info { font-size: 13px; color: var(–text); white-space: nowrap; font-weight: 600; }

/* ── CAL NAV ── */
.cal-nav {
display: flex; align-items: center; justify-content: space-between;
padding: 10px 16px; background: var(–surface); border-bottom: 1px solid var(–border);
}
.cal-nav-btn {
background: var(–surface2); border: 2px solid var(–border); color: var(–text);
width: 40px; height: 40px; border-radius: 8px; font-size: 22px; cursor: pointer;
display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.cal-title { font-family: Consolas, ‘Courier New’, monospace; font-size: 16px; font-weight: 700; }
.today-btn {
background: var(–surface2); border: 2px solid var(–border); color: var(–text);
padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
}

/* ── CONTENT ── */
.content { padding: 12px 12px 100px; }

/* ── MONTH GRID ── */
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.day-header { font-family: Consolas, ‘Courier New’, monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(–muted); text-align: center; padding: 6px 0; }
.day-cell { background: var(–surface); border: 1px solid var(–border); border-radius: 5px; min-height: 68px; padding: 4px; position: relative; }
.day-cell.other-month { opacity: 0.25; }
.day-cell.weekend { background: rgba(255,255,255,0.02); }
.day-cell.today { border: 2px solid var(–accent); }
.day-cell.overbooked { border: 2px solid var(–danger) !important; }
.day-num { font-family: Consolas, ‘Courier New’, monospace; font-size: 11px; font-weight: 700; color: var(–muted); margin-bottom: 3px; }
.day-cell.today .day-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: var(–accent); color: #0f0f11; border-radius: 50%; font-size: 10px; font-weight: 700; }
.day-blocks { display: flex; flex-direction: column; gap: 2px; }
.block { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; }
.block.dl-flag { background: transparent !important; border: 2px solid; font-weight: 700; color: inherit; font-size: 9px; }
.over-pip { position: absolute; top: 2px; right: 2px; font-size: 8px; font-family: Consolas, monospace; font-weight: 700; color: var(–danger); background: rgba(255,122,133,0.15); border: 1px solid rgba(255,122,133,0.4); border-radius: 3px; padding: 0 3px; }

/* ── WEEK VIEW ── */
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.week-col { display: flex; flex-direction: column; }
.week-col-header { text-align: center; padding: 8px 2px; background: var(–surface); border: 1px solid var(–border); border-radius: 6px 6px 0 0; border-bottom: none; }
.wday { font-family: Consolas, ‘Courier New’, monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(–muted); }
.wdate { font-family: Consolas, ‘Courier New’, monospace; font-size: 20px; font-weight: 700; color: var(–text); }
.week-col-header.today-col { border: 2px solid var(–accent); border-bottom: none; }
.today-col .wdate { color: var(–accent); }
.week-col-body { flex: 1; background: var(–surface); border: 1px solid var(–border); border-radius: 0 0 6px 6px; padding: 6px 5px; display: flex; flex-direction: column; gap: 4px; min-height: 220px; }
.week-col-body.today-col { border: 2px solid var(–accent); border-top: none; }
.week-col-body.over-col { border-color: var(–danger); }
.week-block { padding: 6px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #111; line-height: 1.3; }
.week-block.dl-block { background: transparent !important; border: 2px solid; color: inherit; font-weight: 700; }
.week-block .wb-dept { font-size: 10px; opacity: 0.75; margin-top: 2px; font-weight: 600; }
.week-empty { font-size: 12px; color: var(–muted); text-align: center; padding-top: 20px; font-weight: 600; }
.week-over { font-size: 10px; color: var(–danger); margin-top: 3px; font-weight: 700; }

/* ── JOB LIST VIEW ── */
.job-card { background: var(–surface); border: 1px solid var(–border); border-radius: 10px; padding: 16px; margin-bottom: 12px; border-left: 4px solid; }
.job-num { font-family: Consolas, ‘Courier New’, monospace; font-size: 12px; color: var(–muted); font-weight: 600; margin-bottom: 4px; }
.job-name { font-weight: 700; font-size: 17px; line-height: 1.3; }
.job-dept { font-size: 14px; color: var(–muted); margin-top: 3px; font-weight: 500; }
.job-meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.badge { font-family: Consolas, ‘Courier New’, monospace; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(–bg); color: var(–muted); border: 1px solid var(–border); }
.badge-warn { background: rgba(245,224,112,0.15); color: var(–warn); border-color: rgba(245,224,112,0.4); }
.badge-danger { background: rgba(255,122,133,0.15); color: var(–danger); border-color: rgba(255,122,133,0.4); }
.badge-ok { background: rgba(107,222,154,0.15); color: var(–success); border-color: rgba(107,222,154,0.4); }
.job-due { font-size: 13px; color: var(–muted); margin-top: 8px; font-weight: 600; }
.job-btns { display: flex; gap: 10px; margin-top: 14px; }
.jbtn { flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; text-align: center; }
.jbtn-edit { background: var(–surface2); color: var(–text); border: 2px solid var(–border); }
.jbtn-del { background: rgba(255,122,133,0.15); color: var(–danger); border: 2px solid rgba(255,122,133,0.4); }

/* ── EDIT PANEL ── */
.edit-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 2px solid var(–border); }
.edit-label { font-size: 13px; color: var(–accent); font-weight: 700; margin-bottom: 12px; }
.edit-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.edit-fields-full { margin-bottom: 12px; }
.field-label { font-size: 12px; color: var(–muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
input[type=“date”], input[type=“number”], input[type=“text”] {
background: var(–bg); border: 2px solid var(–border); color: var(–text);
padding: 10px 12px; border-radius: 8px; font-size: 15px; width: 100%;
-webkit-appearance: none; appearance: none; font-weight: 500;
}
input:focus { outline: none; border-color: var(–accent); }
input::placeholder { color: var(–muted); }
.edit-btns { display: flex; gap: 10px; }
.edit-save { flex: 2; background: var(–accent); color: #0f0f11; border: none; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
.edit-cancel { flex: 1; background: transparent; border: 2px solid var(–border); color: var(–muted); padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }

/* ── ADD JOB MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-end; }
.modal-overlay.show { display: flex; }
.modal { background: var(–surface); border-radius: 20px 20px 0 0; padding: 24px 18px 50px; width: 100%; position: relative; max-height: 92vh; overflow-y: auto; }
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
.modal-field { margin-bottom: 16px; }
.modal-label { font-size: 12px; color: var(–muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.modal-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.modal-add { width: 100%; background: var(–accent); color: #0f0f11; border: none; padding: 16px; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 6px; }
.modal-close { position: absolute; top: 18px; right: 18px; background: var(–surface2); border: 2px solid var(–border); color: var(–muted); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }

.empty { text-align: center; color: var(–muted); padding: 50px 20px; font-size: 16px; line-height: 1.7; font-weight: 500; }
</style>

</head>
<body>

<div class="topnav">
  <div class="logo">DESIGN<span>SCHED</span></div>
  <button class="add-btn" onclick="openModal()">+ Add Job</button>
</div>

<div class="tabs">
  <div class="tab" onclick="setTab('week')">Week</div>
  <div class="tab active" onclick="setTab('month')">Month</div>
  <div class="tab" onclick="setTab('jobs')">Jobs</div>
</div>

<div class="cap-strip" id="cap-strip">
  <span class="cap-label" id="cap-label">—</span>
  <div class="cap-track"><div class="cap-fill" id="cap-fill"></div></div>
  <span class="cap-info" id="cap-info"></span>
</div>

<div class="cal-nav" id="cal-nav">
  <button class="cal-nav-btn" onclick="prev()">&#8249;</button>
  <div class="cal-title" id="cal-title">—</div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="today-btn" onclick="goToday()">Today</button>
    <button class="cal-nav-btn" onclick="next()">&#8250;</button>
  </div>
</div>

<div class="content" id="content"></div>

<!-- ADD JOB MODAL -->

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div class="modal-title">Add Job</div>
    <div class="modal-field">
      <div class="modal-label">Job Number</div>
      <input type="text" id="f-jobnum" placeholder="e.g. 2026-042" />
    </div>
    <div class="modal-field">
      <div class="modal-label">Job Name</div>
      <input type="text" id="f-name" placeholder="Annual Report cover…" />
    </div>
    <div class="modal-field">
      <div class="modal-label">Department</div>
      <input type="text" id="f-dept" placeholder="e.g. Parks &amp; Recreation" />
    </div>
    <div class="modal-row2">
      <div>
        <div class="modal-label">Deadline</div>
        <input type="date" id="f-deadline" />
      </div>
      <div>
        <div class="modal-label">Days needed</div>
        <input type="number" id="f-days" placeholder="3" min="0.5" step="0.5" />
      </div>
    </div>
    <button class="modal-add" onclick="addJob()">+ Add Job</button>
  </div>
</div>

<script>
let jobs = JSON.parse(localStorage.getItem('ds5-jobs') || '[]');
let viewDate = new Date();
let currentTab = 'month';

const COLORS = [
  '#5b8dee','#e8925b','#5bce8a','#c45bee','#e8d45b',
  '#e85b6a','#5beee8','#ee5bb8','#a3ee5b','#ee8b5b',
  '#5bb8ee','#ee5b5b','#5beebc','#d4ee5b','#b05bee'
];

function save() { localStorage.setItem('ds5-jobs', JSON.stringify(jobs)); }
function dateKey(d) { return d.toISOString().slice(0,10); }
function todayKey() { return dateKey(new Date()); }
function isWorkDay(d) { const w = d.getDay(); return w !== 0 && w !== 6; }

function getJobDays(job) {
  if (!job.deadline || !job.days) return [];
  const deadline = new Date(job.deadline + 'T00:00:00');
  let rem = job.days;
  const result = [];
  const d = new Date(deadline);
  const limit = new Date(deadline.getFullYear() - 5, 0, 1);
  while (rem > 0 && d >= limit) {
    if (isWorkDay(d)) { result.push(new Date(d)); rem--; }
    if (rem > 0) d.setDate(d.getDate() - 1);
  }
  return result;
}

function buildMap() {
  const map = {};
  jobs.forEach((job, ji) => {
    const color = COLORS[ji % COLORS.length];
    getJobDays(job).forEach(d => {
      const k = dateKey(d);
      if (!map[k]) map[k] = [];
      map[k].push({ ji, name: job.name, jobnum: job.jobnum||'', dept: job.department||'', color, dl: false });
    });
    if (job.deadline) {
      const k = job.deadline;
      if (!map[k]) map[k] = [];
      map[k].push({ ji, name: job.name, jobnum: job.jobnum||'', dept: job.department||'', color, dl: true });
    }
  });
  return map;
}

function getMonthStats(y, m) {
  let workDays = 0;
  const d = new Date(y, m, 1);
  while (d.getMonth() === m) { if (isWorkDay(d)) workDays++; d.setDate(d.getDate()+1); }
  const map = buildMap();
  let bookedDays = 0;
  const d2 = new Date(y, m, 1);
  while (d2.getMonth() === m) {
    if (isWorkDay(d2)) {
      const bs = (map[dateKey(d2)]||[]).filter(b=>!b.dl);
      if (new Set(bs.map(b=>b.ji)).size > 0) bookedDays++;
    }
    d2.setDate(d2.getDate()+1);
  }
  return { workDays, bookedDays, freeDays: Math.max(0, workDays - bookedDays) };
}

function weekStart(d) {
  const c = new Date(d); c.setHours(0,0,0,0);
  const dow = c.getDay();
  c.setDate(c.getDate() + (dow === 0 ? -6 : 1 - dow));
  return c;
}

function deadlineStatus(dl) {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dl + 'T00:00:00');
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { label: 'OVERDUE', cls: 'badge-danger' };
  if (diff === 0) return { label: 'DUE TODAY', cls: 'badge-danger' };
  if (diff <= 7) return { label: diff+'d left', cls: 'badge-warn' };
  return { label: diff+'d left', cls: 'badge-ok' };
}

function fmtDate(dl) {
  return new Date(dl+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'});
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function render() {
  updateCapStrip();
  const calNav = document.getElementById('cal-nav');
  const capStrip = document.getElementById('cap-strip');
  calNav.style.display = currentTab === 'jobs' ? 'none' : 'flex';
  capStrip.style.display = currentTab === 'jobs' ? 'none' : 'flex';
  if (currentTab === 'week') renderWeek();
  else if (currentTab === 'month') renderMonth();
  else renderJobList();
}

function updateCapStrip() {
  let y, m;
  if (currentTab === 'week') { const ws = weekStart(viewDate); y = ws.getFullYear(); m = ws.getMonth(); }
  else { y = viewDate.getFullYear(); m = viewDate.getMonth(); }
  const { workDays, bookedDays, freeDays } = getMonthStats(y, m);
  const pct = workDays ? Math.round((bookedDays/workDays)*100) : 0;
  const col = pct > 90 ? 'var(--danger)' : pct > 70 ? 'var(--warn)' : 'var(--success)';
  document.getElementById('cap-fill').style.cssText = `width:${Math.min(pct,100)}%;background:${col}`;
  document.getElementById('cap-label').textContent = new Date(y,m,1).toLocaleString('default',{month:'long',year:'numeric'});
  document.getElementById('cap-info').innerHTML = `<span style="color:${col};font-weight:700">${freeDays}d free</span>`;
}

function renderWeek() {
  const ws = weekStart(viewDate);
  const we = new Date(ws); we.setDate(we.getDate()+4);
  document.getElementById('cal-title').textContent =
    ws.toLocaleDateString('en-NZ',{day:'numeric',month:'short'}) + ' – ' +
    we.toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'});

  const map = buildMap();
  const today = todayKey();
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  let html = '<div class="week-grid">';

  for (let i = 0; i < 5; i++) {
    const d = new Date(ws); d.setDate(ws.getDate()+i);
    const k = dateKey(d);
    const isToday = k === today;
    const all = map[k] || [];
    const work = all.filter(b=>!b.dl);
    const dls = all.filter(b=>b.dl);
    const jobCount = new Set(work.map(b=>b.ji)).size;
    const isOver = jobCount > 1;

    html += `<div class="week-col">
      <div class="week-col-header${isToday?' today-col':''}">
        <div class="wday">${days[i]}</div>
        <div class="wdate">${d.getDate()}</div>
      </div>
      <div class="week-col-body${isToday?' today-col':''}${isOver?' over-col':''}">`;

    if (!work.length && !dls.length) html += `<div class="week-empty">Free</div>`;

    const seenW = new Set();
    work.forEach(b => {
      if (seenW.has(b.ji)) return; seenW.add(b.ji);
      html += `<div class="week-block" style="background:${b.color}">
        <div>${esc(b.name)}</div>
        ${b.dept?`<div class="wb-dept">${esc(b.dept)}</div>`:''}
      </div>`;
    });

    if (isOver) html += `<div class="week-over">&#9888; ${jobCount} jobs overlap</div>`;

    const seenD = new Set();
    dls.forEach(b => {
      if (seenD.has(b.ji)) return; seenD.add(b.ji);
      html += `<div class="week-block dl-block" style="border-color:${b.color};color:${b.color}">
        <div>&#9873; ${esc(b.name)}</div>
      </div>`;
    });

    html += `</div></div>`;
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderMonth() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById('cal-title').textContent =
    new Date(y,m,1).toLocaleString('default',{month:'long',year:'numeric'});

  const map = buildMap();
  const today = todayKey();
  const firstDow = new Date(y,m,1).getDay();
  const dim = new Date(y,m+1,0).getDate();

  let html = '<div class="month-grid">';
  ['S','M','T','W','T','F','S'].forEach(n => html+=`<div class="day-header">${n}</div>`);
  for (let i=0;i<firstDow;i++) html += mCell(new Date(y,m,1-(firstDow-i)),map,today,true);
  for (let i=1;i<=dim;i++) html += mCell(new Date(y,m,i),map,today,false);
  const trail = (7-((firstDow+dim)%7))%7;
  for (let i=1;i<=trail;i++) html += mCell(new Date(y,m+1,i),map,today,true);
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function mCell(date, map, today, other) {
  const k = dateKey(date);
  const all = map[k]||[];
  const work = all.filter(b=>!b.dl);
  const dls = all.filter(b=>b.dl);
  const jobCount = new Set(work.map(b=>b.ji)).size;
  const isToday = k===today;
  const dow = date.getDay();
  let cls = 'day-cell';
  if (other) cls+=' other-month';
  if (dow===0||dow===6) cls+=' weekend';
  if (isToday) cls+=' today';
  if (jobCount>1&&!other) cls+=' overbooked';

  let h = `<div class="${cls}"><div class="day-num">${date.getDate()}</div>`;
  if (jobCount>1) h+=`<div class="over-pip">${jobCount}</div>`;
  h += '<div class="day-blocks">';
  const sw = new Set();
  work.forEach(b=>{ if(sw.has(b.ji))return;sw.add(b.ji); h+=`<div class="block" style="background:${b.color}">${esc(b.name)}</div>`; });
  const sd = new Set();
  dls.forEach(b=>{ if(sd.has(b.ji))return;sd.add(b.ji); h+=`<div class="block dl-flag" style="border-color:${b.color};color:${b.color}">&#9873; ${esc(b.name)}</div>`; });
  h += '</div></div>';
  return h;
}

function renderJobList() {
  const el = document.getElementById('content');
  if (!jobs.length) { el.innerHTML='<div class="empty">No jobs yet.<br>Tap + Add Job to get started.</div>'; return; }

  const sorted = jobs.map((j,i)=>({...j,origIdx:i})).sort((a,b)=>{
    if (!a.deadline) return 1; if (!b.deadline) return -1;
    return a.deadline.localeCompare(b.deadline);
  });

  el.innerHTML = sorted.map(job => {
    const i = job.origIdx;
    const color = COLORS[i%COLORS.length];
    const status = job.deadline ? deadlineStatus(job.deadline) : null;
    const sched = getJobDays(job);
    const startDate = sched.length ? sched[sched.length-1].toLocaleDateString('en-NZ',{day:'numeric',month:'short'}) : '—';

    return `<div class="job-card" id="jcard-${i}" style="border-left-color:${color}">
      <div id="jview-${i}">
        ${job.jobnum?`<div class="job-num">#${esc(job.jobnum)}</div>`:''}
        <div class="job-name">${esc(job.name)}</div>
        <div class="job-dept">${esc(job.department||'')}</div>
        <div class="job-meta">
          ${job.days?`<span class="badge">${job.days}d</span>`:''}
          ${sched.length?`<span class="badge">starts ${startDate}</span>`:''}
          ${status?`<span class="badge ${status.cls}">${status.label}</span>`:''}
        </div>
        <div class="job-due">Due: ${job.deadline?fmtDate(job.deadline):'—'}</div>
        <div class="job-btns">
          <button class="jbtn jbtn-edit" onclick="startEdit(${i})">Edit</button>
          <button class="jbtn jbtn-del" onclick="deleteJob(${i})">Delete</button>
        </div>
      </div>
      <div class="edit-panel" id="epanel-${i}">
        <div class="edit-label">Editing: ${esc(job.name)}</div>
        <div class="edit-fields-full">
          <div class="field-label">Job Number</div>
          <input type="text" id="enum-${i}" value="${esc(job.jobnum||'')}" placeholder="e.g. 2026-042" />
        </div>
        <div class="edit-fields" style="margin-top:10px">
          <div>
            <div class="field-label">Deadline</div>
            <input type="date" id="edl-${i}" value="${job.deadline||''}" />
          </div>
          <div>
            <div class="field-label">Days needed</div>
            <input type="number" id="edays-${i}" value="${job.days||''}" min="0.5" step="0.5" />
          </div>
        </div>
        <div class="edit-btns">
          <button class="edit-save" onclick="saveEdit(${i})">Save</button>
          <button class="edit-cancel" onclick="cancelEdit(${i})">Cancel</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addJob() {
  const name = document.getElementById('f-name').value.trim();
  const dept = document.getElementById('f-dept').value.trim();
  const jobnum = document.getElementById('f-jobnum').value.trim();
  const deadline = document.getElementById('f-deadline').value;
  const days = parseFloat(document.getElementById('f-days').value);
  if (!name) return alert('Please enter a job name.');
  if (!deadline) return alert('Please set a deadline.');
  if (!days||days<=0) return alert('Please enter number of days needed.');
  jobs.push({name, department:dept, jobnum, deadline, days, created:new Date().toISOString()});
  save();
  ['f-name','f-dept','f-jobnum','f-deadline','f-days'].forEach(id=>document.getElementById(id).value='');
  closeModal();
  setTab('jobs');
}

function deleteJob(i) {
  if (!confirm('Delete "' + jobs[i].name + '"?')) return;
  jobs.splice(i,1); save(); render();
}

function startEdit(i) {
  document.getElementById('jview-'+i).style.display = 'none';
  document.getElementById('epanel-'+i).style.display = 'block';
}

function cancelEdit(i) {
  document.getElementById('jview-'+i).style.display = 'block';
  document.getElementById('epanel-'+i).style.display = 'none';
}

function saveEdit(i) {
  const dl = document.getElementById('edl-'+i).value;
  const d = parseFloat(document.getElementById('edays-'+i).value);
  const num = document.getElementById('enum-'+i).value.trim();
  if (dl) jobs[i].deadline = dl;
  if (d > 0) jobs[i].days = d;
  jobs[i].jobnum = num;
  save(); render();
}

function openModal() { document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal')) closeModal(); }

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach((el,i) =>
    el.classList.toggle('active', ['week','month','jobs'][i]===t));
  render();
}

function prev() {
  if (currentTab==='week') viewDate.setDate(viewDate.getDate()-7);
  else viewDate.setMonth(viewDate.getMonth()-1);
  render();
}
function next() {
  if (currentTab==='week') viewDate.setDate(viewDate.getDate()+7);
  else viewDate.setMonth(viewDate.getMonth()+1);
  render();
}
function goToday() { viewDate = new Date(); render(); }

render();
</script>
