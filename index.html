<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Design Scheduler</title>
<style>
:root {
  --bg: #0f0f11; --surface: #1c1c22; --surface2: #26262f; --border: #38384a;
  --text: #f0f0f8; --muted: #a0a0b8; --accent: #7aaaff;
  --success: #6bde9a; --warn: #f5e070; --danger: #ff7a85; --orange: #ffaa55;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 16px; min-height: 100vh; }
.topnav { background: var(--surface); border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
.logo { font-family: Consolas, 'Courier New', monospace; font-size: 15px; letter-spacing: 0.06em; color: var(--accent); font-weight: 700; }
.logo span { color: var(--muted); font-weight: 400; }
.add-btn { background: var(--accent); color: #0f0f11; border: none; padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
.tabs { display: flex; background: var(--surface); border-bottom: 2px solid var(--border); position: sticky; top: 56px; z-index: 99; }
.tab { flex: 1; text-align: center; padding: 14px 4px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.alert-banner { background: rgba(255,170,85,0.15); border-bottom: 2px solid rgba(255,170,85,0.5); padding: 12px 16px; display: none; }
.alert-banner.show { display: block; }
.alert-title { font-size: 13px; font-weight: 700; color: var(--orange); margin-bottom: 6px; }
.alert-item { font-size: 13px; color: var(--text); padding: 4px 0; border-bottom: 1px solid rgba(255,170,85,0.2); cursor: pointer; }
.alert-item:last-child { border-bottom: none; }
.status-legend { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
.legend-dot { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.cal-nav-btn { background: var(--surface2); border: 2px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 8px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.cal-title { font-family: Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; text-align: center; }
.today-btn { background: var(--surface2); border: 2px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.content { padding: 12px 12px 100px; }
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.day-header { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding: 6px 0; font-family: Consolas, monospace; }
.day-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; min-height: 68px; padding: 4px; position: relative; }
.day-cell.other-month { opacity: 0.25; }
.day-cell.weekend { background: rgba(255,255,255,0.02); }
.day-cell.is-today { border: 2px solid var(--accent); }
.day-cell.overbooked { border: 2px solid var(--danger) !important; }
.day-num { font-family: Consolas, monospace; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
.day-cell.is-today .day-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: var(--accent); color: #0f0f11; border-radius: 50%; font-size: 10px; font-weight: 700; }
.day-blocks { display: flex; flex-direction: column; gap: 2px; }
.m-block { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.m-block-dl { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; background: transparent !important; border: 2px solid; }
.over-pip { position: absolute; top: 2px; right: 2px; font-size: 8px; font-family: Consolas, monospace; font-weight: 700; color: var(--danger); background: rgba(255,122,133,0.15); border: 1px solid rgba(255,122,133,0.4); border-radius: 3px; padding: 0 3px; }
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.week-col { display: flex; flex-direction: column; }
.week-col-header { text-align: center; padding: 8px 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px 6px 0 0; border-bottom: none; }
.week-col-header.is-today { border: 2px solid var(--accent); border-bottom: none; }
.wday { font-family: Consolas, monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.wdate { font-family: Consolas, monospace; font-size: 20px; font-weight: 700; }
.week-col-header.is-today .wdate { color: var(--accent); }
.week-col-body { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 6px 6px; padding: 6px 5px; display: flex; flex-direction: column; gap: 4px; min-height: 200px; }
.week-col-body.is-today { border: 2px solid var(--accent); border-top: none; }
.week-col-body.is-over { border-color: var(--danger); }
.w-block { padding: 6px; border-radius: 4px; font-size: 11px; font-weight: 700; line-height: 1.4; cursor: pointer; }
.w-block-dl { padding: 5px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; background: transparent !important; border: 2px solid; }
.wb-num { font-size: 9px; opacity: 0.75; font-weight: 600; }
.wb-name { font-size: 11px; font-weight: 700; }
.wb-dept { font-size: 10px; opacity: 0.75; margin-top: 1px; }
.week-over-warn { font-size: 10px; color: var(--danger); margin-top: 3px; font-weight: 700; }
.span-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; margin-bottom: 4px; }
.span-block { padding: 6px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; line-height: 1.4; cursor: pointer; min-height: 44px; }
.job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; border-left: 4px solid; }
.job-status-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 5px; margin-bottom: 10px; }
.job-num { font-family: Consolas, monospace; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.job-name { font-weight: 700; font-size: 18px; line-height: 1.3; }
.job-dept { font-size: 14px; color: var(--muted); margin-top: 3px; }
.job-notes { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; font-style: italic; }
.job-meta { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.badge { font-family: Consolas, monospace; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
.badge-warn { background: rgba(245,224,112,0.15); color: var(--warn); border-color: rgba(245,224,112,0.4); }
.badge-danger { background: rgba(255,122,133,0.15); color: var(--danger); border-color: rgba(255,122,133,0.4); }
.badge-ok { background: rgba(107,222,154,0.15); color: var(--success); border-color: rgba(107,222,154,0.4); }
.job-due { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 600; }
.job-btns { display: flex; gap: 10px; margin-top: 14px; }
.jbtn { flex: 1; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; text-align: center; }
.jbtn-edit { background: var(--surface2); color: var(--text); border: 2px solid var(--border); }
.jbtn-del { background: rgba(255,122,133,0.15); color: var(--danger); border: 2px solid rgba(255,122,133,0.4); }
.edit-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--border); }
.edit-heading { font-size: 14px; color: var(--accent); font-weight: 700; margin-bottom: 14px; }
.field-grp { margin-bottom: 14px; }
.field-lbl { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
input[type="date"], input[type="number"], input[type="text"], textarea { background: var(--bg); border: 2px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 8px; font-size: 16px; width: 100%; -webkit-appearance: none; appearance: none; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--muted); }
.status-radios { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.status-radio { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; font-size: 15px; font-weight: 600; }
.status-radio input[type="radio"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
.s-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
.edit-btns { display: flex; gap: 10px; }
.edit-save { flex: 2; background: var(--accent); color: #0f0f11; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
.edit-cancel { flex: 1; background: transparent; border: 2px solid var(--border); color: var(--muted); padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-end; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px 18px 50px; width: 100%; position: relative; max-height: 92vh; overflow-y: auto; }
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
.modal-field { margin-bottom: 16px; }
.modal-lbl { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.modal-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.modal-add { width: 100%; background: var(--accent); color: #0f0f11; border: none; padding: 16px; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 6px; }
.modal-close { position: absolute; top: 18px; right: 18px; background: var(--surface2); border: 2px solid var(--border); color: var(--muted); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 16px; line-height: 1.7; }
</style>
</head>
<body>
<div class="topnav">
  <div class="logo">DESIGN<span>SCHED</span></div>
  <button class="add-btn" onclick="openModal()">+ Add Job</button>
</div>
<div class="tabs">
  <div class="tab" onclick="setTab('week')">Week</div>
  <div class="tab active" onclick="setTab('month')">Month</div>
  <div class="tab" onclick="setTab('jobs')">Jobs</div>
</div>
<div class="alert-banner" id="alert-banner">
  <div class="alert-title">&#9888; Jobs that should have started - tap to update status:</div>
  <div id="alert-items"></div>
</div>
<div class="status-legend" id="status-legend">
  <div class="legend-item"><div class="legend-dot" style="background:#5b8dee"></div>Not started</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5bce8a"></div>In progress</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0f0f8;border:1px solid #666"></div>Complete</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffaa55"></div>Overdue start</div>
</div>
<div class="cal-nav" id="cal-nav">
  <button class="cal-nav-btn" onclick="prev()">&#8249;</button>
  <div class="cal-title" id="cal-title">Loading...</div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="today-btn" onclick="goToday()">Today</button>
    <button class="cal-nav-btn" onclick="next()">&#8250;</button>
  </div>
</div>
<div class="content" id="content"></div>
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div class="modal-title">Add Job</div>
    <div class="modal-field"><div class="modal-lbl">Job Number</div><input type="text" id="f-jobnum" placeholder="e.g. 2026-042" /></div>
    <div class="modal-field"><div class="modal-lbl">Job Name</div><input type="text" id="f-name" placeholder="Annual Report cover..." /></div>
    <div class="modal-field"><div class="modal-lbl">Department</div><input type="text" id="f-dept" placeholder="e.g. Parks and Recreation" /></div>
    <div class="modal-row2">
      <div><div class="modal-lbl">Deadline</div><input type="date" id="f-deadline" /></div>
      <div><div class="modal-lbl">Days needed</div><input type="number" id="f-days" placeholder="3" min="0.5" step="0.5" /></div>
    </div>
    <div class="modal-field"><div class="modal-lbl">Notes</div><textarea id="f-notes" placeholder="Any notes about this job..."></textarea></div>
    <button class="modal-add" onclick="addJob()">+ Add Job</button>
  </div>
</div>

<script>
var jobs = JSON.parse(localStorage.getItem('ds6-jobs') || '[]');
var viewDate = new Date();
var currentTab = 'month';

function save() { localStorage.setItem('ds6-jobs', JSON.stringify(jobs)); }

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function makeDateKey(d) {
  var y = d.getFullYear();
  var mo = d.getMonth() + 1;
  var dy = d.getDate();
  return y + '-' + (mo < 10 ? '0' + mo : mo) + '-' + (dy < 10 ? '0' + dy : dy);
}

function getTodayKey() { return makeDateKey(new Date()); }

function isWorkDay(d) { var w = d.getDay(); return w !== 0 && w !== 6; }

function getWeekMonday(d) {
  var c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dow = c.getDay();
  c.setDate(c.getDate() + (dow === 0 ? -6 : 1 - dow));
  return c;
}

function formatDate(dl) {
  var d = new Date(dl + 'T00:00:00');
  return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' });
}

function getJobDays(job) {
  if (!job.deadline || !job.days) return [];
  var deadline = new Date(job.deadline + 'T00:00:00');
  var rem = Number(job.days);
  var result = [];
  var cur = new Date(deadline.getFullYear(), deadline.getMonth(), deadline.getDate());
  var limit = new Date(deadline.getFullYear() - 5, 0, 1);
  while (rem > 0 && cur >= limit) {
    if (isWorkDay(cur)) { result.push(new Date(cur)); rem--; }
    if (rem > 0) cur.setDate(cur.getDate() - 1);
  }
  return result;
}

function getJobColor(job) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var status = job.status || 'notstarted';
  if (status === 'complete') return { bg: '#f0f0f8', fg: '#111111' };
  if (status === 'inprogress') return { bg: '#5bce8a', fg: '#111111' };
  var sched = getJobDays(job);
  var startDate = sched.length ? sched[sched.length - 1] : null;
  if (startDate && startDate < today) return { bg: '#ffaa55', fg: '#111111' };
  return { bg: '#5b8dee', fg: '#111111' };
}

function getDeadlineStatus(dl) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var d = new Date(dl + 'T00:00:00');
  var diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { label: 'OVERDUE', cls: 'badge-danger' };
  if (diff === 0) return { label: 'DUE TODAY', cls: 'badge-danger' };
  if (diff <= 7) return { label: diff + 'd left', cls: 'badge-warn' };
  return { label: diff + 'd left', cls: 'badge-ok' };
}

function buildScheduleMap() {
  var map = {};
  var ji, job, col, days, dk, k;
  for (ji = 0; ji < jobs.length; ji++) {
    job = jobs[ji];
    col = getJobColor(job);
    days = getJobDays(job);
    for (dk = 0; dk < days.length; dk++) {
      k = makeDateKey(days[dk]);
      if (!map[k]) map[k] = [];
      map[k].push({ ji: ji, name: job.name, jobnum: job.jobnum || '', dept: job.department || '', bg: col.bg, fg: col.fg, dl: false });
    }
    if (job.deadline) {
      k = job.deadline;
      if (!map[k]) map[k] = [];
      map[k].push({ ji: ji, name: job.name, jobnum: job.jobnum || '', dept: job.department || '', bg: col.bg, fg: col.fg, dl: true });
    }
  }
  return map;
}

function checkAlerts() {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var banner = document.getElementById('alert-banner');
  var itemsEl = document.getElementById('alert-items');
  var html = '';
  var ji, job, sched, startDate;
  for (ji = 0; ji < jobs.length; ji++) {
    job = jobs[ji];
    if ((job.status || 'notstarted') !== 'notstarted') continue;
    sched = getJobDays(job);
    startDate = sched.length ? sched[sched.length - 1] : null;
    if (startDate && startDate < today) {
      html += '<div class="alert-item" onclick="goToJob(' + ji + ')">' + (job.jobnum ? '#' + escHtml(job.jobnum) + ' - ' : '') + escHtml(job.name) + ' - tap to update</div>';
    }
  }
  if (html) { banner.classList.add('show'); itemsEl.innerHTML = html; }
  else { banner.classList.remove('show'); itemsEl.innerHTML = ''; }
}

function render() {
  checkAlerts();
  var calNav = document.getElementById('cal-nav');
  var legend = document.getElementById('status-legend');
  var isJobs = (currentTab === 'jobs');
  calNav.style.display = isJobs ? 'none' : 'flex';
  legend.style.display = isJobs ? 'none' : 'flex';
  if (currentTab === 'week') renderWeek();
  else if (currentTab === 'month') renderMonth();
  else renderJobList();
}

function renderMonth() {
  var y = viewDate.getFullYear();
  var m = viewDate.getMonth();
  document.getElementById('cal-title').textContent = new Date(y, m, 1).toLocaleString('default', { month: 'long', year: 'numeric' });
  var map = buildScheduleMap();
  var today = getTodayKey();
  var firstDow = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var html = '<div class="month-grid">';
  var headers = ['S','M','T','W','T','F','S'];
  var hi;
  for (hi = 0; hi < headers.length; hi++) html += '<div class="day-header">' + headers[hi] + '</div>';
  var pi, di, ti;
  for (pi = 0; pi < firstDow; pi++) html += buildMonthCell(new Date(y, m, 1 - (firstDow - pi)), map, today, true);
  for (di = 1; di <= daysInMonth; di++) html += buildMonthCell(new Date(y, m, di), map, today, false);
  var trail = (7 - ((firstDow + daysInMonth) % 7)) % 7;
  for (ti = 1; ti <= trail; ti++) html += buildMonthCell(new Date(y, m + 1, ti), map, today, true);
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function buildMonthCell(date, map, today, other) {
  var k = makeDateKey(date);
  var all = map[k] || [];
  var work = [], dls = [], ai, b;
  for (ai = 0; ai < all.length; ai++) { b = all[ai]; if (b.dl) dls.push(b); else work.push(b); }
  var seenW = {}, seenD = {};
  var jobCount = 0;
  for (ai = 0; ai < work.length; ai++) { if (!seenW[work[ai].ji]) { seenW[work[ai].ji] = 1; jobCount++; } }
  seenW = {};
  var isToday = (k === today);
  var dow = date.getDay();
  var cls = 'day-cell';
  if (other) cls += ' other-month';
  if (dow === 0 || dow === 6) cls += ' weekend';
  if (isToday) cls += ' is-today';
  if (jobCount > 1 && !other) cls += ' overbooked';
  var h = '<div class="' + cls + '"><div class="day-num">' + date.getDate() + '</div>';
  if (jobCount > 1) h += '<div class="over-pip">' + jobCount + '</div>';
  h += '<div class="day-blocks">';
  for (ai = 0; ai < work.length; ai++) {
    b = work[ai];
    if (seenW[b.ji]) continue; seenW[b.ji] = 1;
    h += '<div class="m-block" style="background:' + b.bg + ';color:' + b.fg + '" onclick="goToJob(' + b.ji + ')">' + escHtml(b.name) + '</div>';
  }
  for (ai = 0; ai < dls.length; ai++) {
    b = dls[ai];
    if (seenD[b.ji]) continue; seenD[b.ji] = 1;
    h += '<div class="m-block-dl" style="border-color:' + b.bg + ';color:' + b.bg + '" onclick="goToJob(' + b.ji + ')">&#9873; ' + escHtml(b.name) + '</div>';
  }
  h += '</div></div>';
  return h;
}

function renderWeek() {
  var ws = getWeekMonday(viewDate);
  var we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 4);
  document.getElementById('cal-title').textContent =
    ws.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }) + ' - ' +
    we.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' });
  var map = buildScheduleMap();
  var today = getTodayKey();
  var dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  var weekDates = [], weekKeys = [], wi;
  for (wi = 0; wi < 5; wi++) {
    var wd = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + wi);
    weekDates.push(wd);
    weekKeys.push(makeDateKey(wd));
  }

function addJob() {
var name = document.getElementById(‘f-name’).value.trim();
var dept = document.getElementById(‘f-dept’).value.trim();
var jobnum = document.getElementById(‘f-jobnum’).value.trim();
var deadline = document.getElementById(‘f-deadline’).value;
var days = parseFloat(document.getElementById(‘f-days’).value);
var notes = document.getElementById(‘f-notes’).value.trim();
if (!name) { alert(‘Please enter a job name.’); return; }
if (!deadline) { alert(‘Please set a deadline.’); return; }
if (!days || days <= 0) { alert(‘Please enter number of days needed.’); return; }
jobs.push({ name: name, department: dept, jobnum: jobnum, deadline: deadline, days: days, notes: notes, status: ‘notstarted’, created: new Date().toISOString() });
save();
var fields = [‘f-name’, ‘f-dept’, ‘f-jobnum’, ‘f-deadline’, ‘f-days’, ‘f-notes’];
var fi;
for (fi = 0; fi < fields.length; fi++) document.getElementById(fields[fi]).value = ‘’;
closeModal();
setTab(‘jobs’);
}

function deleteJob(i) {
if (!confirm(‘Delete “’ + jobs[i].name + ‘”?’)) return;
jobs.splice(i, 1); save(); render();
}

function startEdit(i) {
document.getElementById(‘jview-’ + i).style.display = ‘none’;
document.getElementById(‘epanel-’ + i).style.display = ‘block’;
}

function cancelEdit(i) {
document.getElementById(‘jview-’ + i).style.display = ‘block’;
document.getElementById(‘epanel-’ + i).style.display = ‘none’;
}

function saveEdit(i) {
var name = document.getElementById(‘ename-’ + i).value.trim();
var dept = document.getElementById(‘edept-’ + i).value.trim();
var dl = document.getElementById(‘edl-’ + i).value;
var d = parseFloat(document.getElementById(‘edays-’ + i).value);
var num = document.getElementById(‘enum-’ + i).value.trim();
var notes = document.getElementById(‘enotes-’ + i).value.trim();
var stEl = document.querySelector(‘input[name=“st-’ + i + ‘”]:checked’);
var status = stEl ? stEl.value : (jobs[i].status || ‘notstarted’);
if (name) jobs[i].name = name;
jobs[i].department = dept;
if (dl) jobs[i].deadline = dl;
if (d > 0) jobs[i].days = d;
jobs[i].jobnum = num;
jobs[i].notes = notes;
jobs[i].status = status;
save(); render();
}

function openModal() { document.getElementById(‘modal’).classList.add(‘show’); }
function closeModal() { document.getElementById(‘modal’).classList.remove(‘show’); }
function closeModalOutside(e) { if (e.target === document.getElementById(‘modal’)) closeModal(); }

function setTab(t) {
currentTab = t;
var tabEls = document.querySelectorAll(’.tab’);
var tabNames = [‘week’, ‘month’, ‘jobs’];
var ti;
for (ti = 0; ti < tabEls.length; ti++) tabEls[ti].classList.toggle(‘active’, tabNames[ti] === t);
render();
}

function prev() {
if (currentTab === ‘week’) viewDate.setDate(viewDate.getDate() - 7);
else viewDate.setMonth(viewDate.getMonth() - 1);
render();
}

function next() {
if (currentTab === ‘week’) viewDate.setDate(viewDate.getDate() + 7);
else viewDate.setMonth(viewDate.getMonth() + 1);
render();
}

function goToday() { viewDate = new Date(); render(); }

function goToJob(ji) {
setTab(‘jobs’);
setTimeout(function() {
var card = document.getElementById(‘jcard-’ + ji);
if (card) {
card.scrollIntoView({ behavior: ‘smooth’, block: ‘start’ });
card.style.outline = ‘3px solid #7aaaff’;
setTimeout(function() { card.style.outline = ‘’; }, 1500);
}
}, 60);
}

render();
</script>
